[package]
name = "stadhouder"
version = "0.2.0"
edition = "2021"

[lib]
name = "stadhouder"
path = "src/lib.rs"

[dependencies]
common = { path = "../common" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Only the current process's own memory - no components/disks/network/users.
sysinfo = { version = "0.37", default-features = false, features = ["system"] }
